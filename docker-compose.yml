# Production-ish stack for a single EC2 box: API + Redis. Nginx runs on the host (deploy/nginx.conf)
# and serves client/dist. See README "Deploy".
services:
  api:
    build: { context: ., dockerfile: server/Dockerfile }
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:4000:4000"]
    depends_on: [redis]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # ephemeral by design (PRD §19)
    restart: unless-stopped
